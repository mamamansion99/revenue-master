<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>จดยอดบัญชี</title>
<style>
  /* โทนตาม Apple HIG: grouped inset list + Liquid Glass เฉพาะแถบบันทึกที่ลอยอยู่ (functional layer)
     contrast (ข้อความ ≤17px ต้อง ≥4.5:1): secondary #6C6C70 บนขาว 5.1:1 · บน #F2F2F7 4.6:1
     dark: #98989F บน #1C1C1E 6.0:1 · ปุ่ม: ตัวหนา 17px ขาวบน #007AFF 4.0:1 (เกณฑ์ตัวหนา 3:1) */
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --secondary: #6C6C70;
    --separator: rgba(60, 60, 67, 0.29);
    --fill: rgba(118, 118, 128, 0.12);
    --accent: #007AFF;
    --success: #1F7A34;
    --warn: #B25000;
    --glass: rgba(255, 255, 255, 0.72);
    --glass-edge: rgba(0, 0, 0, 0.08);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --secondary: #98989F;
      --separator: rgba(84, 84, 88, 0.65);
      --fill: rgba(118, 118, 128, 0.24);
      --accent: #0A84FF;
      --success: #30D158;
      --warn: #FF9F0A;
      --glass: rgba(30, 30, 32, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
  }
  @media (prefers-contrast: more) {
    :root { --secondary: #3A3A3C; --separator: rgba(60, 60, 67, 0.6); --glass-edge: rgba(0, 0, 0, 0.35); }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    :root { --secondary: #C7C7CC; --separator: rgba(235, 235, 245, 0.5); --glass-edge: rgba(255, 255, 255, 0.45); }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", sans-serif;
    letter-spacing: -0.2px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left));
  }

  /* Large title */
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px; margin: 20px 4px 2px; }
  .subtitle { color: var(--secondary); font-size: 15px; margin: 0 4px; }
  .progress { height: 4px; border-radius: 2px; background: var(--fill); margin: 12px 4px 0; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--success); border-radius: 2px; transition: width .3s ease; }

  /* Grouped inset sections */
  .section { margin-top: 28px; }
  .section-header { color: var(--secondary); font-size: 13px; line-height: 18px; font-weight: 400; margin: 0 16px 7px; }
  .section-footer { color: var(--secondary); font-size: 13px; line-height: 18px; margin: 7px 16px 0; }
  .section-footer.warn { color: var(--warn); }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; position: relative; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--separator); }
  .cell-main { flex: 1; min-width: 0; }
  .title { font-size: 17px; font-weight: 600; }
  .meta { color: var(--secondary); font-size: 13px; line-height: 18px; margin-top: 2px; }
  .acct { font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
  .meta.acct { color: var(--label); font-size: 15px; line-height: 20px; }
  .meta.warn { color: var(--warn); }
  .saved { color: var(--success); }

  /* ช่องกรอก: พื้น fill แบบ iOS, สูง 44, 17px กัน iOS ซูมเอง */
  input {
    font: inherit; color: var(--label);
    background: var(--fill); border: 0; border-radius: 10px;
    min-height: 44px; padding: 0 12px;
    outline: none; appearance: none; -webkit-appearance: none;
  }
  input.amount { flex: none; width: 40%; min-width: 128px; max-width: 190px; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  input.amount::placeholder { color: var(--secondary); opacity: 0.7; }
  input[type="date"] { min-height: 36px; font-size: 17px; }
  input:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .cell-label { flex: 1; }

  .loading { color: var(--secondary); padding: 14px 16px; font-size: 15px; }
  button.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer; }

  /* Scroll edge effect: เนื้อหาจางลงก่อนถึงแถบลอย แทนการชนกันตรง ๆ */
  .edge {
    position: fixed; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--bg) 75%);
  }

  /* Liquid Glass — ใช้ที่เดียว: แถบบันทึกที่ลอยอยู่ */
  .toolbar {
    position: fixed; z-index: 2;
    left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    max-width: 616px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 18px; border-radius: 26px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    backdrop-filter: blur(28px) saturate(1.4);
    border: 0.5px solid var(--glass-edge);
    box-shadow: var(--glass-shadow);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .toolbar { background: var(--card); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .toolbar { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  #msg { flex: 1; font-size: 15px; line-height: 20px; color: var(--secondary); min-width: 0; }
  #msg.ok { color: var(--success); }
  #msg.err { color: var(--warn); }

  /* ปุ่มหลักปุ่มเดียวในหน้า: ลงสีที่พื้นปุ่ม */
  button.primary {
    flex: none; min-height: 44px; padding: 0 24px; border: 0; border-radius: 22px;
    background: var(--accent); color: #FFFFFF;
    font: 600 17px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", "Noto Sans Thai", sans-serif;
    cursor: pointer; transition: transform .12s ease, opacity .12s ease;
  }
  button.primary:active { transform: scale(0.97); }
  button.primary:disabled { opacity: 0.4; cursor: default; }
  button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>จดยอดบัญชี</h1>
  <p class="subtitle" id="sub">กำลังโหลด…</p>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <section class="section">
    <div class="group">
      <label class="cell">
        <span class="cell-label">ยอด ณ สิ้นวันที่</span>
        <input type="date" id="asOf" aria-label="วันที่ของยอดคงเหลือ">
      </label>
    </div>
    <p class="section-footer" id="note"></p>
  </section>

  <section class="section">
    <h2 class="section-header" id="listHeader">บัญชี</h2>
    <div class="group" id="list"><div class="loading">กำลังโหลด…</div></div>
  </section>
</main>

<div class="edge" aria-hidden="true"></div>
<div class="toolbar" role="toolbar" aria-label="บันทึกยอด">
  <span id="msg" role="status" aria-live="polite"></span>
  <button class="primary" id="save" disabled>บันทึก</button>
</div>

<script>
  // API = web app ของ Revenue Master (Apps Script) — เรียกแบบไม่ส่ง cookie กัน Google แทรก /u/1/
  var API = 'https://script.google.com/macros/s/AKfycbxLXVbQXxcYocLXGDVUEO5aGU6EFX1kuQU0iGEM4VpSsyLm4Dn13PspoiY9-2KgGhcF/exec';
  var params = new URLSearchParams(location.search);
  var TOKEN = params.get('t') || '';
  var OWNER = (params.get('owner') || '').toUpperCase(); // MA / KP / KK — ว่าง = ทุกบัญชี
  var state = null;

  // timeoutMs: คำขอที่ค้างเงียบ ๆ จะถูกตัดแทนที่จะขึ้น "กำลังโหลด…" ไปเรื่อย ๆ
  function api(method, query, body, timeoutMs) {
    var url = API + (query ? '?' + new URLSearchParams(query).toString() : '');
    var opt = { method: method, credentials: 'omit', redirect: 'follow' };
    if (body) opt.body = JSON.stringify(body); // text/plain = ไม่มี preflight
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = null;
    if (ctrl) { opt.signal = ctrl.signal; timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 30000); }
    return fetch(url, opt)
      .catch(function (e) { throw new Error(e && e.name === 'AbortError' ? 'ระบบตอบช้าเกินไป' : 'เชื่อมต่อไม่ได้'); })
      .then(function (r) { return r.text(); })
      .finally(function () { if (timer) clearTimeout(timer); })
      .then(function (txt) {
        var res;
        try { res = JSON.parse(txt); } catch (e) { throw new Error('ระบบตอบกลับไม่ใช่ข้อมูลที่อ่านได้'); }
        if (!res.ok) throw new Error(res.error || 'ไม่ทราบสาเหตุ');
        return res.state;
      });
  }

  function fmt(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function thDate(ymd) {
    if (!ymd) return '';
    var m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    var p = String(ymd).split('-');
    return p.length < 3 ? ymd : (Number(p[2]) + ' ' + m[Number(p[1]) - 1]);
  }
  // เลขบัญชี 10 หลัก (ธนาคารส่วนใหญ่) = xxx-x-xxxxx-x, แบบอื่นแสดงตามจริง
  function fmtAcct(no) {
    var d = String(no || '').replace(/\D/g, '');
    return d.length === 10 ? d.slice(0, 3) + '-' + d[3] + '-' + d.slice(4, 9) + '-' + d[9] : d;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function setMsg(text, kind) {
    var el = document.getElementById('msg');
    el.textContent = text || '';
    el.className = kind || '';
  }

  function render(s) {
    state = s;
    document.getElementById('asOf').value = s.asOf;
    document.getElementById('sub').textContent =
      (s.owner ? 'บัญชีของ ' + s.owner + ' · ' : '') + 'รอบ ' + s.cycle + ' · จดแล้ว ' + s.savedCount + ' จาก ' + s.expected;
    document.getElementById('bar').style.width = (s.expected ? (s.savedCount / s.expected * 100) : 0) + '%';

    var note = document.getElementById('note');
    if (s.afterAsOf) {
      note.className = 'section-footer warn';
      note.textContent = '⚠︎ เลยวันที่ ' + thDate(s.asOf) + ' แล้ว ให้กรอกยอดคงเหลือหลังรายการสุดท้ายของวันที่ ' +
        thDate(s.asOf) + ' จากรายการเดินบัญชี ไม่ใช่ยอดคงเหลือตอนนี้';
    } else {
      note.className = 'section-footer';
      note.textContent = 'กรอกยอดคงเหลือตอนนี้ได้เลย ถ้ามีเงินเข้าหรือออกอีกก่อนเที่ยงคืน พรุ่งนี้เช้าให้เปิดลิงก์นี้แล้วแก้เป็นยอดหลังรายการสุดท้ายของวันที่ ' + thDate(s.asOf);
    }

    document.getElementById('listHeader').textContent =
      (s.owner ? 'บัญชีของ ' + s.owner : 'บัญชีทั้งหมด') + ' · ' + s.expected + ' บัญชี';

    var n = s.accounts.length;
    document.getElementById('list').innerHTML = s.accounts.map(function (a, i) {
      var lines = [];
      lines.push('<div class="meta acct">' + (a.accountNo ? esc(fmtAcct(a.accountNo)) : 'ไม่มีเลขบัญชีในระบบ') + '</div>');
      lines.push('<div class="meta">' + esc(String(a.bankLabel || '').replace(/^ธนาคาร/, '')) + '</div>');
      if (a.lastClose != null) {
        lines.push('<div class="meta" title="ยอดปิดรอบก่อน ' + thDate(a.lastCloseDate) + '">ปิดรอบก่อน <span class="acct">' + fmt(a.lastClose) + '</span></div>');
      }
      if (a.saved != null) {
        var at = String(a.savedAt || '');
        lines.push('<div class="meta saved">✓ บันทึกแล้ว ' + esc(thDate(at.slice(0, 10)) + ' ' + at.slice(11)) + '</div>');
      }
      if (a.ledgerAfter) {
        lines.push('<div class="meta warn">⚠︎ ระบบเห็นเงินเข้าหลังวันที่ ' + thDate(s.asOf) + ' แล้ว ' + a.ledgerAfter.count +
          ' รายการ รวม ' + fmt(a.ledgerAfter.amount) + ' ถ้ากรอกยอดตอนนี้จะเกินไปประมาณเท่านี้</div>');
      }
      var id = 'amt-' + i;
      return '<div class="cell">' +
        '<label class="cell-main" for="' + id + '"><div class="title">' + esc(a.code) + '</div>' + lines.join('') + '</label>' +
        '<input class="amount" id="' + id + '" inputmode="decimal" autocomplete="off" enterkeyhint="' + (i === n - 1 ? 'done' : 'next') + '"' +
        ' data-code="' + esc(a.code) + '" placeholder="0.00" aria-label="ยอดคงเหลือ ' + esc(a.code) + '" value="' +
        (a.saved != null ? fmt(a.saved) : '') + '">' +
        '</div>';
    }).join('') || '<div class="loading">ไม่มีบัญชีในรายการนี้</div>';

    var inputs = document.querySelectorAll('input.amount');
    inputs.forEach(function (el, i) {
      el.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        if (inputs[i + 1]) inputs[i + 1].focus(); else el.blur();
      });
      el.addEventListener('blur', function () {
        var raw = el.value.replace(/[,\s฿]/g, '');
        if (raw !== '' && isFinite(Number(raw))) el.value = fmt(raw);
      });
    });
    document.getElementById('save').disabled = false;
  }

  function load(asOf) {
    document.getElementById('save').disabled = true;
    setMsg('');
    var q = { page: 'snapshot-api', t: TOKEN, asOf: asOf || '', owner: OWNER };
    api('GET', q)
      .catch(function () { return api('GET', q); }) // ลองใหม่อัตโนมัติ 1 ครั้ง
      .then(render)
      .catch(function (e) {
        document.getElementById('sub').textContent = 'โหลดไม่สำเร็จ';
        document.getElementById('list').innerHTML = '<div class="loading">' + esc(e.message) +
          ' <button class="link" id="retry">ลองอีกครั้ง</button></div>';
        document.getElementById('retry').addEventListener('click', function () {
          document.getElementById('sub').textContent = 'กำลังโหลด…';
          document.getElementById('list').innerHTML = '<div class="loading">กำลังโหลด…</div>';
          load(asOf);
        });
      });
  }

  document.getElementById('asOf').addEventListener('change', function () { load(this.value); });

  document.getElementById('save').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input.amount');
    var entries = [], bad = [];
    inputs.forEach(function (el) {
      var raw = el.value.replace(/[,\s฿]/g, '');
      if (raw === '') return;
      if (!isFinite(Number(raw))) bad.push(el.dataset.code);
      entries.push({ code: el.dataset.code, amount: raw });
    });
    if (bad.length) { setMsg('ไม่ใช่ตัวเลข: ' + bad.join(', '), 'err'); return; }
    if (!entries.length) { setMsg('ยังไม่ได้กรอกยอด', 'err'); return; }
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก…';
    setMsg('');
    var asOf = state.asOf;
    function finish() { btn.textContent = 'บันทึก'; }
    function done(s) {
      render(s);
      finish();
      if (s.complete) setMsg('✓ บันทึกครบ ' + s.expected + ' บัญชี' + (s.owner ? 'ของ ' + s.owner + 'แล้ว' : 'แล้ว ส่งบิลได้'), 'ok');
      else setMsg('บันทึกแล้ว ยังขาด ' + s.missing.join(', '));
    }
    api('GET', { page: 'snapshot-api', action: 'save', t: TOKEN, asOf: asOf, owner: OWNER, entries: JSON.stringify(entries) }, null, 60000)
      .then(done)
      .catch(function (e) {
        // ผลตอบกลับอาจหายระหว่างทางทั้งที่บันทึกลงชีทแล้ว — โหลดยอดจากชีทมาเทียบก่อนบอกว่าพลาด
        setMsg('กำลังตรวจกับชีท…');
        api('GET', { page: 'snapshot-api', t: TOKEN, asOf: asOf, owner: OWNER }).then(function (s) {
          var saved = {};
          s.accounts.forEach(function (a) { if (a.saved != null) saved[a.code] = Number(a.saved); });
          var miss = entries.filter(function (x) { return !(x.code in saved) || Math.abs(saved[x.code] - Number(x.amount)) > 0.001; });
          if (!miss.length) return done(s);
          btn.disabled = false; finish();
          setMsg('บันทึกไม่สำเร็จ (' + miss.map(function (x) { return x.code; }).join(', ') + ') ' + e.message + ' กดบันทึกอีกครั้ง', 'err');
        }).catch(function () { btn.disabled = false; finish(); setMsg('บันทึกไม่สำเร็จ ' + e.message + ' กดบันทึกอีกครั้ง', 'err'); });
      });
  });

  load(params.get('asOf') || '');
</script>
</body>
</html>
